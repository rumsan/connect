name: Dev CI/CD
on:
  push:
    branches:
      - 'dev'
  pull_request:
    branches:
      - 'dev'
  workflow_dispatch:

env:
  CI: false
  # env_npmrc: ${{ secrets.ENV_NPMRC }}

jobs:
  deploy:
    name: build && push image to Docker hub
    runs-on: ubuntu-latest
    # if: contains(github.event.head_commit.message, 'action') || contains(github.event.pull_request.title, 'action') || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: import env file
        env:
          env_release: ${{ secrets.CONNECT_UI }}
        run: |
          touch ./.env && echo "$env_release" >> ./.env
          grep -v '^#' ./.env | grep '=' >> $GITHUB_ENV

      - uses: actions/setup-node@v3
        with:
          node-version: 20.10.0

      - name: install dependencies and build apps
        env:
          NX_NO_CLOUD: true
        run: |
          npm install -g pnpm@10.12.1
          pnpm install --frozen-lockfile
          pnpm prisma:generate
          pnpm build:all

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Import Secrets
        uses: hashicorp/vault-action@v2.4.0
        with:
          url: ${{ secrets.VAULT_URL }}
          token: ${{ secrets.VAULT_TOKEN }}
          secrets: |
            github/data/general/docker/rumsan username | DOCKERHUB_USERNAME ;
            github/data/general/docker/rumsan password | DOCKERHUB_TOKEN ;

      - name: docker login
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # Connect Image
      - name: build && push connect rumsan docker hub
        id: build-push-connect
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.connect
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: rumsan/connect:dev

      # Asterisk Worker Image
      - name: build && push asterisk-worker
        id: build-push-asterisk-worker
        uses: docker/build-push-action@v3
        with:
          context: .
          file: Dockerfile.asterisk-worker
          push: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
          tags: rumsan/asterisk-worker:dev

      - name: build && push connect-ui
        id: build-push-connect-ui
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/console/Dockerfile
          push: true
          build-args: |
            CONNECT_API_URL=${{ env.CONNECT_API_URL }}
            ADMIN_API_KEY=${{ env.ADMIN_API_KEY }}
            GOOGLE_CLIENT_ID=${{ env.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ env.GOOGLE_CLIENT_SECRET }}
            NEXTAUTH_SECRET=${{ env.NEXTAUTH_SECRET }}
            NEXTAUTH_URL=${{ env.NEXTAUTH_URL }}
            ADMIN_EMAILS=${{ env.ADMIN_EMAILS }}
            ALLOWED_GOOGLE_DOMAIN=${{ env.ALLOWED_GOOGLE_DOMAIN }}
          tags: rumsan/connect-ui:dev
